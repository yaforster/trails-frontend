services:
  trails-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: trails-frontend:local
    env_file:
      - trails-frontend.env
    ports:
      - '${TRAILS_FRONTEND_HOST_BIND:-127.0.0.1}:${TRAILS_FRONTEND_HOST_PORT:-4200}:80'
    restart: unless-stopped
    networks:
      - default
      - trails-public

networks:
  trails-public:
    name: trails-public
    external: true
